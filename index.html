<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Exhibition - Open House Fisika</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .main-card {
            background: var(--card-bg); width: 100%; max-width: 500px; padding: 32px 24px;
            border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid var(--border-color); text-align: center;
        }

        h2 { margin: 0 0 4px 0; font-size: 22px; font-weight: 700; color: var(--text-main); }
        p { margin: 0 0 24px 0; color: var(--text-muted); font-size: 14px; }

        input {
            width: 100%; padding: 14px 16px; border-radius: 10px; border: 1.5px solid #cbd5e1;
            font-size: 16px; outline: none; margin-bottom: 16px; text-align: center; font-weight: 600;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: var(--primary); color: white; font-weight: 700; font-size: 15px; cursor: pointer;
        }
        .btn:hover { background: var(--primary-hover); }

        .alert { padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 14px; }
        .alert-error { background: #fee2e2; color: #991b1b; }

        /* CANDIDATE CARDS */
        .candidate-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; text-align: left; }
        .candidate-item {
            border: 2px solid var(--border-color); border-radius: 12px; padding: 12px;
            display: flex; align-items: center; gap: 14px; cursor: pointer; background: white;
        }
        .candidate-item:hover { border-color: var(--primary); background: #f0f7ff; }
        .candidate-item.selected { border-color: var(--primary); background: #eff6ff; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
        .candidate-img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; background: #e2e8f0; }
        .candidate-info { flex: 1; }
        .candidate-title { font-weight: 700; font-size: 15px; color: var(--text-main); }
        .candidate-school { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .hidden { display: none; }
    </style>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACSezxOlaZvNNUsxmLi8mjH85q878k_tE",
            authDomain: "open-house-efb30.firebaseapp.com",
            databaseURL: "https://open-house-efb30-default-rtdb.firebaseio.com",
            projectId: "open-house-efb30",
            storageBucket: "open-house-efb30.firebasestorage.app",
            messagingSenderId: "115256004823",
            appId: "1:115256004823:web:e2ae984236905bface6092"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let activeCode = "";
        let selectedCandidateId = "";

        window.verifikasiKode = async function() {
            const codeInput = document.getElementById('userCode').value.trim().toUpperCase();
            const msgBox = document.getElementById('msgBox');
            msgBox.className = "alert hidden";

            if(!codeInput) {
                showMsg("Masukkan kode akses Anda terlebih dahulu.");
                return;
            }

            try {
                const participantRef = ref(db, `participants/${codeInput}`);
                const snapshot = await get(participantRef);

                if (!snapshot.exists()) {
                    showMsg("Kode tidak ditemukan. Pastikan Anda sudah terdaftar.");
                    return;
                }

                const data = snapshot.val();

                if (!data.isPresent) {
                    showMsg("Kode Anda belum diaktifkan. Sila registrasi di meja panitia.");
                    return;
                }

                if (data.hasVoted) {
                    showMsg("Kode ini sudah pernah digunakan untuk memilih.");
                    return;
                }

                activeCode = codeInput;
                
                // Load Candidate List
                await loadCandidates();

                document.getElementById('step-verifikasi').classList.add('hidden');
                document.getElementById('step-voting').classList.remove('hidden');
                document.getElementById('welcomeName').innerText = "Selamat datang, " + (data.name || "Peserta");

            } catch (err) {
                console.error(err);
                showMsg("Gagal terhubung ke database.");
            }
        }

        async function loadCandidates() {
            const candidateSnap = await get(ref(db, 'candidates'));
            const container = document.getElementById('candidateContainer');
            container.innerHTML = "";

            if (!candidateSnap.exists()) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted);">Belum ada finalis yang terdaftar.</p>`;
                return;
            }

            candidateSnap.forEach((child) => {
                let id = child.key;
                let data = child.val();

                let item = document.createElement('div');
                item.className = "candidate-item";
                item.onclick = function() {
                    document.querySelectorAll('.candidate-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedCandidateId = id;
                };

                item.innerHTML = `
                    <img src="${data.photo}" class="candidate-img" alt="Foto">
                    <div class="candidate-info">
                        <div class="candidate-title">${data.name}</div>
                        <div class="candidate-school">${data.school}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.kirimVote = async function() {
            if(!selectedCandidateId) {
                alert("Sila pilih salah satu kelompok finalis terlebih dahulu!");
                return;
            }

            try {
                const participantRef = ref(db, `participants/${activeCode}`);
                await update(participantRef, {
                    hasVoted: true,
                    votedCandidateId: selectedCandidateId
                });

                document.getElementById('step-voting').classList.add('hidden');
                document.getElementById('step-sukses').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                alert("Gagal mengirim suara. Coba lagi.");
            }
        }

        function showMsg(text) {
            const msgBox = document.getElementById('msgBox');
            msgBox.innerText = text;
            msgBox.className = "alert alert-error";
        }
    </script>
</head>
<body>

    <div class="main-card">
        <h2>Voting Exhibition Stand</h2>
        <p>Open House Departemen Fisika 2026</p>

        <!-- STEP 1: VERIFIKASI KODE -->
        <div id="step-verifikasi">
            <input type="text" id="userCode" placeholder="Masukkan Kode Akses (cth: OH01)" style="text-transform:uppercase;">
            <button class="btn" onclick="verifikasiKode()">Masuk ke Halaman Vote</button>
            <div id="msgBox" class="alert hidden"></div>
        </div>

        <!-- STEP 2: PILIH FINALIS DARI DATABASE -->
        <div id="step-voting" class="hidden">
            <h4 id="welcomeName" style="color:var(--primary); margin-top:0; margin-bottom:16px;"></h4>
            <div class="candidate-list" id="candidateContainer">
                <!-- Data kandidat terisi dari Firebase -->
            </div>
            <button class="btn" onclick="kirimVote()">Kirim Suara Anda</button>
        </div>

        <!-- STEP 3: SUKSES -->
        <div id="step-sukses" class="hidden">
            <h3 style="color:#10b981; margin:0 0 10px 0;">Suara Berhasil Terkirim</h3>
            <p>Terima kasih atas partisipasi Anda dalam Open House Departemen Fisika 2026.</p>
        </div>
    </div>

</body>
</html>
