<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Registrasi - Open House Fisika</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #eef2f5; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2, h3 { color: #1a252f; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
        .btn-ots { background-color: #17a2b8; }
        .btn-ots:hover { background-color: #138496; }
        .alert { padding: 10px; border-radius: 6px; font-size: 14px; margin-top: 10px; text-align: center; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #ffe6e6; color: #d9534f; border: 1px solid #f5c6cb; }
    </style>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACSezxOlaZvNNUsxmLi8mjH85q878k_tE",
            authDomain: "open-house-efb30.firebaseapp.com",
            databaseURL: "https://open-house-efb30-default-rtdb.firebaseio.com",
            projectId: "open-house-efb30",
            storageBucket: "open-house-efb30.firebasestorage.app",
            messagingSenderId: "115256004823",
            appId: "1:115256004823:web:e2ae984236905bface6092"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. AKTIVASI KODE DARI RSVP ONLINE
        window.aktivasiPeserta = async function() {
            const codeInput = document.getElementById('checkinCode').value.trim().toUpperCase();
            const msgBox = document.getElementById('msgCheckin');

            if(!codeInput) {
                showMsg(msgBox, "Masukkan kode peserta!", "error");
                return;
            }

            try {
                const participantRef = ref(db, `participants/${codeInput}`);
                const snapshot = await get(participantRef);

                if(!snapshot.exists()) {
                    showMsg(msgBox, "❌ Kode tidak terdaftar di sistem RSVP!", "error");
                    return;
                }

                await update(participantRef, { isPresent: true });
                showMsg(msgBox, `✅ Berhasil! ${snapshot.val().name || codeInput} diaktifkan & siap nge-vote!`, "success");
                document.getElementById('checkinCode').value = "";

            } catch (err) {
                console.error(err);
                showMsg(msgBox, "Terjadi kesalahan!", "error");
            }
        }

        // 2. REGISTRASI PESERTA BARU (OTS)
        window.daftarOTS = async function() {
            const name = document.getElementById('otsName').value.trim();
            const school = document.getElementById('otsSchool').value.trim();
            const msgBox = document.getElementById('msgOTS');

            if(!name) {
                showMsg(msgBox, "Harap isi nama pengunjung!", "error");
                return;
            }

            // Generate Kode Unik OTS (Contoh: OH-OTS742)
            const randomCode = "OH-OTS" + Math.floor(100 + Math.random() * 900);
            
            try {
                const newRef = ref(db, `participants/${randomCode}`);
                await set(newRef, {
                    name: name,
                    school: school || "-",
                    isPresent: true, // Langsung aktif karena daftar di lokasi
                    hasVoted: false,
                    votedCandidateId: null
                });

                showMsg(msgBox, `🎉 OTS Berhasil! KODE PESERTA: ${randomCode}`, "success");
                document.getElementById('otsName').value = "";
                document.getElementById('otsSchool').value = "";

            } catch (err) {
                console.error(err);
                showMsg(msgBox, "Gagal membuat kode OTS!", "error");
            }
        }

        function showMsg(el, text, type) {
            el.innerText = text;
            el.className = `alert alert-${type}`;
            el.style.display = 'block';
        }
    </script>
</head>
<body>

    <h2>🛠️ Panel Panitia - Open House</h2>

    <!-- SEKSI 1: CHECK-IN RSVP -->
    <div class="card">
        <h3>1. Check-In Pengunjung RSVP</h3>
        <p>Ketik Kode Unik milik pengunjung yang menunjukkan kartu/tiket RSVP:</p>
        <input type="text" id="checkinCode" placeholder="Masukkan Kode (contoh: OH-101)" style="text-transform:uppercase;">
        <button onclick="aktivasiPeserta()">Konfirmasi Kehadiran (Aktifkan Vote)</button>
        <div id="msgCheckin" class="alert" style="display:none;"></div>
    </div>

    <!-- SEKSI 2: REGISTRASI OTS -->
    <div class="card">
        <h3>2. Pendaftaran On-The-Spot (OTS)</h3>
        <p>Bagi pengunjung yang belum pernah ngisi RSVP online sebelumnya:</p>
        <input type="text" id="otsName" placeholder="Nama Lengkap Pengunjung">
        <input type="text" id="otsSchool" placeholder="Asal Sekolah / Instansi">
        <button class="btn-ots" onclick="daftarOTS()">Buat Kode & Aktifkan</button>
        <div id="msgOTS" class="alert" style="display:none;"></div>
    </div>

</body>
</html>
