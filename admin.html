<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Registrasi - Open House Fisika</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #eef2f5; max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 25px; }
        h2, h3 { color: #1a252f; margin-top: 0; margin-bottom: 15px; }
        .form-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group > div { flex: 1; min-width: 200px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #495057; font-size: 14px; }
        input, select, button { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ced4da; font-size: 14px; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; }
        button:hover { background-color: #218838; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; background: white; }
        th, td { border-bottom: 1px solid #ddd; padding: 12px 15px; text-align: left; }
        th { background-color: #007bff; color: white; font-weight: 600; border-radius: 4px 4px 0 0;}
        tr:hover { background-color: #f8f9fa; }
        .badge { padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;}
        
        .search-bar { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ced4da; font-size: 14px; }
    </style>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Database-mu
        const firebaseConfig = {
            apiKey: "AIzaSyACSezxOlaZvNNUsxmLi8mjH85q878k_tE",
            authDomain: "open-house-efb30.firebaseapp.com",
            databaseURL: "https://open-house-efb30-default-rtdb.firebaseio.com",
            projectId: "open-house-efb30",
            storageBucket: "open-house-efb30.firebasestorage.app",
            messagingSenderId: "115256004823",
            appId: "1:115256004823:web:e2ae984236905bface6092"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Menghitung nomor urut kode agar selalu lanjut (OH-101, OH-102, dst)
        async function getNextCode() {
            const snapshot = await get(ref(db, 'participants'));
            if (!snapshot.exists()) return 101;
            let count = 0;
            snapshot.forEach(() => { count++; });
            return 101 + count;
        }

        // FUNGSI INPUT DATA PENDAFTARAN
        window.tambahPeserta = async function() {
            const name = document.getElementById('inputName').value.trim();
            const role = document.getElementById('inputRole').value.trim();
            const school = document.getElementById('inputSchool').value.trim();

            if (!name || !role) { 
                alert("Harap isi Nama dan Status/Peran Pengunjung!"); 
                return; 
            }

            // Generate Kode (contoh: OH-152)
            let startIndex = await getNextCode();
            let code = "OH-" + startIndex;

            // Simpan ke database
            await set(ref(db, `participants/${code}`), {
                name: name,
                role: role,
                school: school || "-",
                isPresent: true, // Karena diinput saat datang, langsung dihitung Hadir
                hasVoted: false,
                votedCandidateId: null
            });

            alert(`🎉 Berhasil Didata!\n\nKODE VOTING: ${code}\nSilakan berikan kode ini ke pengunjung.`);
            
            // Kosongkan form setelah input
            document.getElementById('inputName').value = "";
            document.getElementById('inputRole').value = "Siswa";
            document.getElementById('inputSchool').value = "";
            document.getElementById('inputName').focus();
        }

        // LOAD TABEL PESERTA SECARA REAL-TIME
        const participantsRef = ref(db, 'participants');
        onValue(participantsRef, (snapshot) => {
            const tableBody = document.getElementById('participantTableBody');
            tableBody.innerHTML = "";

            if (!snapshot.exists()) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px;">Belum ada data pendaftar.</td></tr>`;
                return;
            }

            let searchKeyword = document.getElementById('searchInput').value.toLowerCase();

            snapshot.forEach((child) => {
                let code = child.key;
                let data = child.val();
                
                // Pastikan role ada valuenya agar tidak error saat dicari
                let roleDisplay = data.role || "-"; 

                // Fitur Cari Data
                if (data.name.toLowerCase().includes(searchKeyword) || 
                    data.school.toLowerCase().includes(searchKeyword) || 
                    roleDisplay.toLowerCase().includes(searchKeyword) || 
                    code.toLowerCase().includes(searchKeyword)) {
                    
                    let row = document.createElement('tr');
                    row.innerHTML = `
                        <td style="font-family: monospace; font-size: 15px; font-weight: bold; color: #d9534f;">${code}</td>
                        <td><strong>${data.name}</strong></td>
                        <td>${roleDisplay}</td>
                        <td>${data.school}</td>
                        <td><span class="badge">✔ Hadir & Aktif</span></td>
                        <td style="font-size: 12px; color: ${data.hasVoted ? 'green' : 'orange'}; font-weight:bold;">
                            ${data.hasVoted ? "Sudah Vote" : "Belum Vote"}
                        </td>
                    `;
                    tableBody.appendChild(row);
                }
            });
        });

        // Fitur auto-update pencarian
        window.filterData = function() {
            const evt = new Event('value');
        }
    </script>
</head>
<body>

    <h2>📝 Meja Registrasi (Front Desk) - Open House</h2>

    <!-- FORM INPUT PENDAFTARAN -->
    <div class="card" style="border-top: 5px solid #28a745;">
        <h3>➕ Data Pengunjung Baru</h3>
        
        <div class="form-group">
            <div>
                <label for="inputName">Nama Panjang</label>
                <input type="text" id="inputName" placeholder="Contoh: Budi Santoso">
            </div>
            
            <div>
                <label for="inputRole">Status Pengunjung</label>
                <!-- Kombinasi Datalist & Input text agar bisa pilih ATAU ngetik manual -->
                <input type="text" id="inputRole" list="roleOptions" placeholder="Pilih atau ketik status..." value="Siswa">
                <datalist id="roleOptions">
                    <option value="Siswa">
                    <option value="Guru / Pendamping">
                    <option value="Orang Tua Murid">
                    <option value="Mahasiswa">
                    <option value="Umum">
                </datalist>
            </div>

            <div>
                <label for="inputSchool">Asal Instansi/Sekolah</label>
                <input type="text" id="inputSchool" placeholder="Contoh: SMAN 5 Surabaya">
            </div>
        </div>
        
        <button onclick="tambahPeserta()">Buat Kode & Daftarkan Pengunjung</button>
    </div>

    <!-- TABEL LOG PESERTA -->
    <div class="card">
        <h3>📋 Daftar Log Pengunjung Masuk</h3>
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Cari nama pengunjung, sekolah, status, atau kode..." onkeyup="filterData()">
        
        <table>
            <thead>
                <tr>
                    <th>Kode Akses</th>
                    <th>Nama Panjang</th>
                    <th>Status</th>
                    <th>Asal Instansi</th>
                    <th>Presensi</th>
                    <th>Aktivitas Vote</th>
                </tr>
            </thead>
            <tbody id="participantTableBody">
                <!-- Data akan terisi otomatis di sini -->
            </tbody>
        </table>
    </div>

</body>
</html>
